[workspace]
members = ["crates/pingora-proxy-delegate", "crates/pingora-proxy-router"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fiadliel/pingora-proxy-delegate"

[workspace.dependencies]
async-trait = "0.1"
bytes = "1"
http = "1"
pingora-cache = "0.9"
pingora-core = "0.9"
pingora-http = "0.9"
pingora-proxy = "0.9"
proc-macro2 = "1"
quote = "1"
syn = "2"
tokio = "1"
trybuild = "1"
