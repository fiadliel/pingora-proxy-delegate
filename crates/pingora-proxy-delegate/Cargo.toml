[package]
name = "pingora-proxy-delegate"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
description = "Proc-macro that generates ProxyHttp delegation boilerplate for Pingora decorator patterns"
license.workspace = true
documentation = "https://docs.rs/pingora-proxy-delegate"
readme = "README.md"
repository.workspace = true
keywords = ["pingora", "proc-macro", "delegation"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[features]
default = ["upstream_modules"]
# Forward the hooks Pingora declares behind `pingora-proxy/upstream_modules`.
# Must match `pingora-proxy/upstream_modules`; a mismatch in either direction
# fails to compile rather than silently leaving the hooks on Pingora's defaults.
upstream_modules = []

[dependencies]
syn = { workspace = true, features = ["full"] }
quote.workspace = true
proc-macro2.workspace = true

[dev-dependencies]
trybuild.workspace = true
async-trait.workspace = true
# Tests always see the complete hook surface. Building this crate's tests
# without its `upstream_modules` feature is therefore a feature mismatch,
# which tests/trybuild.rs uses to check that the mismatch is rejected.
pingora-proxy = { workspace = true, features = ["upstream_modules"] }
pingora-core.workspace = true
pingora-cache.workspace = true
pingora-http.workspace = true
bytes.workspace = true
http.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt"] }
